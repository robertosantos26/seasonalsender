services:
  - type: web
    name: seasonalsender
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn startup:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 90
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GAS_WEBHOOK_URL
        sync: false
      - key: CRON_SECRET
        sync: false
